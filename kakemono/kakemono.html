<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Kakemono — Mayi Togo Tourism</title>
  <script src="config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    @page { size: 80cm 200cm; margin: 0; }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body { width: 100vw; height: 100vh; overflow: hidden; background: #111; }

    #outer {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #1a1a1a;
    }

    #kk-scale {
      width: 800px; height: 2000px; flex-shrink: 0;
      transform-origin: center center;
      font-family: 'Inter', sans-serif;
      background: #ffffff;
      position: relative; overflow: hidden;
    }

    /* ══════════════════════════════════════════
       1 — HEADER
    ══════════════════════════════════════════ */
    .header {
      background: #ffffff;
      height: 88px;
      padding: 0 36px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 4px solid var(--c-primary, #006a44);
      flex-shrink: 0;
    }
    .hdr-left { display: flex; align-items: center; gap: 16px; }
    .jpope-word {
      font-size: 46px; font-weight: 900; letter-spacing: -1.5px;
      color: var(--c-primary, #006a44); line-height: 1;
    }
    .hdr-sep { width: 3px; height: 52px; background: var(--c-primary, #006a44); border-radius: 2px; opacity: .6; }
    .hdr-titles { line-height: 1.35; }
    .hdr-titles .t1 { font-size: 15px; font-weight: 800; color: #111; }
    .hdr-titles .t2 { font-size: 13px; font-weight: 500; color: #555; }
    .hdr-right img { height: 60px; width: auto; object-fit: contain; }

    /* ══════════════════════════════════════════
       2 — HERO
    ══════════════════════════════════════════ */
    .hero {
      background: var(--hero-bg);
      position: relative; overflow: hidden;
      padding: 44px 40px 0;
      min-height: 740px;
      display: flex; flex-direction: column; align-items: center;
    }
    /* subtle dot grid */
    .hero::before {
      content: '';
      position: absolute; inset: 0; z-index: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,.07) 1px, transparent 1px);
      background-size: 28px 28px;
    }
    /* Togo flag stripe */
    .hero::after {
      content: '';
      position: absolute; bottom: 0; left: 0; right: 0; height: 5px; z-index: 3;
      background: linear-gradient(90deg, #006a44 33%, #ffcb00 33% 66%, #d21034 66%);
    }

    .hero-inner { position: relative; z-index: 2; width: 100%; display: flex; flex-direction: column; align-items: center; }

    .hero-top { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
    .hero-logo-box {
      width: 66px; height: 66px; border-radius: 18px; overflow: hidden; flex-shrink: 0;
      border: 2px solid rgba(255,255,255,.35);
      box-shadow: 0 6px 24px rgba(0,0,0,.3);
      background: rgba(255,255,255,.15);
      display: flex; align-items: center; justify-content: center; font-size: 28px;
    }
    .hero-logo-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hero-badge {
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 22px; padding: 7px 20px;
      font-size: 11px; font-weight: 700; color: #fff;
      letter-spacing: 1.8px; text-transform: uppercase;
    }

    .app-name {
      font-size: 96px; font-weight: 900; color: #fff;
      letter-spacing: -3px; line-height: 1;
      text-shadow: 0 4px 28px rgba(0,0,0,.35);
    }
    .app-sub {
      font-size: 16px; color: rgba(255,255,255,.72);
      margin-top: 10px; margin-bottom: 38px; font-weight: 500;
    }

    /* phones */
    .phones-row {
      display: flex; align-items: flex-end; justify-content: center; gap: 18px;
      width: 100%;
    }
    .ph { display: flex; flex-direction: column; align-items: center; }
    .ph-frame {
      border-radius: 30px; overflow: hidden; position: relative;
      box-shadow: 0 22px 60px rgba(0,0,0,.55);
    }
    .ph-frame.sm { width: 158px; height: 316px; border: 6px solid rgba(255,255,255,.22); }
    .ph-frame.lg {
      width: 190px; height: 380px; border: 7px solid rgba(255,255,255,.42);
      box-shadow: 0 28px 80px rgba(0,0,0,.65), 0 0 50px rgba(255,255,255,.08);
    }
    .ph-notch {
      position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
      width: 34px; height: 5px; background: rgba(0,0,0,.45); border-radius: 3px; z-index: 5;
    }
    .ph-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ph-fb {
      width: 100%; height: 100%; display: none;
      align-items: center; justify-content: center;
      background: linear-gradient(160deg, #082010, #0a1e12); font-size: 32px;
    }

    /* ══════════════════════════════════════════
       3 — TAGLINE
    ══════════════════════════════════════════ */
    .tagline-wrap {
      background: #f2faf6;
      padding: 30px 52px;
      text-align: center;
      border-bottom: 2px solid #d0ece0;
    }
    .tagline-text {
      font-size: 21px; font-weight: 700; color: #0d2d1a; line-height: 1.5;
    }
    .tagline-text em { color: var(--c-primary, #006a44); font-style: normal; }

    /* ══════════════════════════════════════════
       PILL SECTION TITLE  (shared)
    ══════════════════════════════════════════ */
    .pill-row {
      display: flex; justify-content: center;
      padding: 30px 0 26px;
    }
    .pill-row span {
      background: linear-gradient(90deg, var(--c-primary, #006a44), var(--c-accent, #00a865));
      color: #fff; font-size: 17px; font-weight: 700;
      padding: 11px 46px; border-radius: 44px;
      box-shadow: 0 4px 18px rgba(0,106,68,.32);
      letter-spacing: .3px;
    }

    /* ══════════════════════════════════════════
       4 — FEATURES
    ══════════════════════════════════════════ */
    .features-wrap { background: #fff; padding: 0 52px 16px; }
    .feat-item { display: flex; align-items: flex-start; gap: 22px; margin-bottom: 30px; }
    .hex {
      width: 62px; height: 62px; flex-shrink: 0;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      display: flex; align-items: center; justify-content: center; font-size: 26px;
    }
    .hex-g1 { background: linear-gradient(135deg, #006a44, #00a865); }
    .hex-g2 { background: linear-gradient(135deg, #0055b3, #0099e6); }
    .hex-g3 { background: linear-gradient(135deg, #a36a00, #ffcb00); }
    .hex-g4 { background: linear-gradient(135deg, #7a2020, #d21034); }
    .feat-text h4 {
      font-size: 14px; font-weight: 800; color: #0d2d1a;
      text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px;
    }
    .feat-text p { font-size: 13px; color: #4a6060; line-height: 1.6; }

    /* ══════════════════════════════════════════
       5 — TECH
    ══════════════════════════════════════════ */
    .tech-wrap {
      background: #f5faf7;
      padding: 0 52px 36px;
      border-top: 2px solid #d8ede4;
    }
    .tech-logos {
      display: flex; align-items: center; justify-content: center;
      flex-wrap: wrap; gap: 20px 28px;
    }
    .tech-item { display: flex; flex-direction: column; align-items: center; gap: 7px; }
    .tech-item img { width: 46px; height: 46px; object-fit: contain; }
    .tech-item span { font-size: 11px; font-weight: 600; color: #3a5a4a; }

    /* ══════════════════════════════════════════
       6 — FOOTER
    ══════════════════════════════════════════ */
    .footer {
      background: var(--c-primary, #006a44);
      padding: 28px 40px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 20px;
    }
    .footer-left { display: flex; align-items: center; gap: 18px; flex: 1; }
    .footer-logo { height: 58px; width: auto; object-fit: contain; filter: brightness(0) invert(1); flex-shrink: 0; }
    .footer-tagline { font-size: 17px; font-weight: 700; color: #fff; line-height: 1.45; }
    .footer-tagline em { color: var(--c-gold, #ffcb00); font-style: normal; }
    .footer-qr {
      background: #fff; border-radius: 12px; padding: 12px 12px 8px;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      flex-shrink: 0;
    }
    .footer-qr img { width: 86px; height: 86px; object-fit: contain; border-radius: 4px; }
    .qr-ph { width: 86px; height: 86px; border-radius: 4px; background: repeating-conic-gradient(#000 0% 25%, #fff 0% 50%) 0 0 / 8px 8px; }
    .footer-qr span { font-size: 9px; font-weight: 700; color: #333; text-align: center; line-height: 1.4; }
  </style>
</head>
<body>
<div id="outer">
<div id="kk-scale">

  <!-- 1 — HEADER -->
  <div class="header">
    <div class="hdr-left">
      <div class="jpope-word">JPOPE</div>
      <div class="hdr-sep"></div>
      <div class="hdr-titles">
        <div class="t1">Journées Portes Ouvertes</div>
        <div class="t2">Projets Etudiants</div>
      </div>
    </div>
    <div class="hdr-right"><img id="hdr-logo" src="" alt="Logo école" /></div>
  </div>

  <!-- 2 — HERO -->
  <div class="hero">
    <div class="hero-inner">
      <div class="hero-top">
        <div class="hero-logo-box" id="hero-logo"></div>
        <div class="hero-badge" id="hero-badge"></div>
      </div>
      <div class="app-name" id="app-name"></div>
      <div class="app-sub"  id="app-sub"></div>
      <div class="phones-row">
        <div class="ph"><div class="ph-frame sm"><div class="ph-notch"></div>
          <img id="ph1-img" class="ph-img" alt="" />
          <div id="ph1-fb" class="ph-fb" style="display:none;">📱</div>
        </div></div>
        <div class="ph"><div class="ph-frame lg"><div class="ph-notch"></div>
          <img id="ph2-img" class="ph-img" alt="" />
          <div id="ph2-fb" class="ph-fb" style="display:none;">📱</div>
        </div></div>
        <div class="ph"><div class="ph-frame sm"><div class="ph-notch"></div>
          <img id="ph3-img" class="ph-img" alt="" />
          <div id="ph3-fb" class="ph-fb" style="display:none;">📱</div>
        </div></div>
      </div>
    </div>
  </div>

  <!-- 3 — TAGLINE -->
  <div class="tagline-wrap">
    <div class="tagline-text" id="tagline"></div>
  </div>

  <!-- 4 — FEATURES -->
  <div class="features-wrap">
    <div class="pill-row"><span>Objectifs de la plateforme</span></div>
    <div id="feat-list"></div>
  </div>

  <!-- 5 — TECH -->
  <div class="tech-wrap">
    <div class="pill-row"><span>Technologies utilisées</span></div>
    <div class="tech-logos" id="tech-logos"></div>
  </div>

  <!-- 6 — FOOTER -->
  <div class="footer">
    <div class="footer-left">
      <img class="footer-logo" id="footer-logo" src="" alt="Logo" />
      <div class="footer-tagline" id="footer-tagline"></div>
    </div>
    <div class="footer-qr" id="footer-qr"></div>
  </div>

</div><!-- #kk-scale -->
</div><!-- #outer -->

<script>
/* ── Couleurs CSS ── */
var r = document.documentElement.style;
r.setProperty('--c-primary', CFG.colors.primary);
r.setProperty('--c-accent',  CFG.colors.accent);
r.setProperty('--c-gold',    CFG.colors.gold);
r.setProperty('--c-red',     CFG.colors.red);
r.setProperty('--hero-bg',   CFG.colors.hero_bg  || 'linear-gradient(150deg,#00391f 0%,#005530 45%,#006a44 100%)');

/* ── Header ── */
document.getElementById('hdr-logo').src = CFG.logo_ecole;

/* ── Hero ── */
var hlb = document.getElementById('hero-logo');
hlb.innerHTML = CFG.logo_app
  ? '<img src="' + CFG.logo_app + '" alt="logo" />'
  : '<span style="font-size:30px">🌍</span>';
document.getElementById('hero-badge').textContent = CFG.hero_tag;
document.getElementById('app-name').textContent   = CFG.app_name;
document.getElementById('app-sub').textContent    = CFG.app_subtitle;

/* ── Phones ── */
[
  { img:'ph1-img', fb:'ph1-fb', src:CFG.screen1_src },
  { img:'ph2-img', fb:'ph2-fb', src:CFG.screen2_src },
  { img:'ph3-img', fb:'ph3-fb', src:CFG.screen3_src },
].forEach(function(s) {
  var img = document.getElementById(s.img);
  var fb  = document.getElementById(s.fb);
  img.onerror = function() { img.style.display='none'; fb.style.display='flex'; };
  img.src = s.src;
});

/* ── Features ── */
var hexMap = ['hex-g1','hex-g2','hex-g3','hex-g4'];
var fl = document.getElementById('feat-list');
CFG.features.forEach(function(f, i) {
  fl.innerHTML +=
    '<div class="feat-item">' +
      '<div class="hex ' + (f.hexClass || hexMap[i % 4]) + '">' + f.icon + '</div>' +
      '<div class="feat-text"><h4>' + f.titre + '</h4><p>' + f.desc + '</p></div>' +
    '</div>';
});

/* ── Tech ── */
var tl = document.getElementById('tech-logos');
CFG.stack.forEach(function(s) {
  tl.innerHTML +=
    '<div class="tech-item"><img src="' + s.icon + '" alt="' + s.label + '" /><span>' + s.label + '</span></div>';
});

/* ── Footer ── */
document.getElementById('footer-logo').src = CFG.logo_ecole;
document.getElementById('footer-tagline').innerHTML = CFG.footer_tagline;
var fqr = document.getElementById('footer-qr');
fqr.innerHTML = CFG.qr_src
  ? '<img src="' + CFG.qr_src + '" alt="QR" /><span>' + CFG.qr_label + '</span>'
  : '<div class="qr-ph"></div><span>' + CFG.qr_label + '</span>';

/* ── Scale plein écran ── */
function scale() {
  var el = document.getElementById('kk-scale');
  var s  = Math.min(window.innerWidth / 800, window.innerHeight / 2000) * 0.98;
  el.style.transform = 'scale(' + s + ')';
}
scale();
window.addEventListener('resize', scale);
</script>
</body>
</html>
