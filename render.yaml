services:
  - type: web
    name: mayib
    runtime: python
    rootDir: backend/mayib
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py collectstatic --noinput && python manage.py migrate && gunicorn mayib.wsgi:application --workers 2 --log-file -
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: mayib-db
          property: connectionString

databases:
  - name: mayib-db
    databaseName: mayib
    user: mayib
