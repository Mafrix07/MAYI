name: frontend_new
description: "Mayi Togo Tourism - Application mobile"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  # State management
  provider: ^6.1.2

  # HTTP & Stockage
  http: ^1.6.0
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.2.3

  # Utilitaires
  url_launcher: ^6.2.5
  image_picker: ^1.1.2   # ← Ajouté pour l'upload capture paiement S2
  intl: ^0.19.0           # ← Ajouté pour les dates (réservations S2)
  flutter_rating_bar: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/togo_land.jpg
    - assets/images/monument_1.jpg
    - assets/images/monument_1.jpg
